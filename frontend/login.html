<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In — Codexhub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F5EEFF;
    --paper-line:#E4DBF5;
    --ink:#1B1230;
    --ink-soft:#5B5470;
    --navy:#22103F;
    --navy-700:#2E1065;
    --stamp:#6D28D9;
    --stamp-soft:#8B5CF6;
    --brass:#E9D8FD;
    --white:#FFFFFF;
    --muted-on-navy:#B8A9E0;
    --radius-sm:8px;
    --radius:12px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    font-family:'IBM Plex Sans',sans-serif; color:var(--ink);
    background:var(--paper);
    background-image:radial-gradient(circle, rgba(27,18,48,0.14) 1px, transparent 1px);
    background-size:16px 16px;
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:24px;
    -webkit-font-smoothing:antialiased;
  }
  h1{font-family:'IBM Plex Serif',serif; font-size:clamp(22px,5vw,26px); font-weight:700; letter-spacing:-0.01em; margin-bottom:6px;}
  p.lead{color:var(--muted-on-navy); font-size:13.5px; margin-bottom:0;}
  a{color:inherit;}
  a:focus-visible, button:focus-visible, input:focus-visible{outline:3px solid var(--stamp); outline-offset:2px;}
  @media (prefers-reduced-motion: reduce){ *{animation:none !important; transition:none !important;} }

  /* ---- Admission-ticket card, matching the homepage signature element ---- */
  .ticket{
    width:100%; max-width:400px;
    background:var(--white); border:1.5px solid var(--ink);
    border-radius:16px; overflow:hidden;
    box-shadow:0 22px 46px rgba(34,16,63,0.18);
  }
  .ticket-stub{
    background:var(--navy); color:var(--white);
    padding:22px 24px 20px;
    position:relative;
  }
  .ticket-stub::after{
    content:"";
    position:absolute; left:0; right:0; bottom:0;
    border-bottom:2px dashed rgba(255,255,255,0.28);
  }
  .ticket-top-row{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:14px;}
  .ticket-serial{font-family:'IBM Plex Mono',monospace; font-size:9.5px; color:var(--muted-on-navy); letter-spacing:.05em; text-transform:uppercase;}
  .ticket-mark{
    width:32px; height:32px; border-radius:50%;
    border:1.5px solid rgba(255,255,255,0.35);
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
    font-family:'IBM Plex Mono',monospace; font-size:8px; font-weight:700; color:var(--muted-on-navy);
    text-align:center; line-height:1.2;
  }

  .ticket-main{padding:26px 24px 24px;}

  .brand-cluster{display:flex; align-items:center; gap:8px; margin-bottom:16px;}
  .logo-badge, .school-badge{
    width:34px; height:34px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0; overflow:hidden;
    background:var(--white); border:1.5px solid rgba(255,255,255,0.35);
  }
  .logo-badge img, .school-badge img{width:100%; height:100%; object-fit:cover;}
  .brand-name{font-family:'IBM Plex Serif',serif; font-weight:700; font-size:13.5px; color:var(--white);}

  form{display:flex; flex-direction:column; gap:12px;}
  input{
    padding:13px 15px; border-radius:var(--radius-sm); border:1.5px solid var(--paper-line);
    font-size:14.5px; font-family:inherit; width:100%; background:var(--paper); color:var(--ink);
  }
  input:focus{outline:none; border-color:var(--stamp);}
  button{
    padding:14px; border:none; border-radius:999px;
    background:var(--stamp); color:var(--white); font-weight:600; font-size:15px;
    cursor:pointer; font-family:inherit; margin-top:4px;
    box-shadow:0 4px 14px rgba(109,40,217,0.28);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  button:hover:not(:disabled){transform:translateY(-1px); box-shadow:0 8px 20px rgba(109,40,217,0.35);}
  button:disabled{opacity:0.6; cursor:not-allowed;}
  .msg{font-size:12.5px; margin-top:2px; text-align:center; min-height:18px;}
  .msg.error{color:#B3261E;}
  .msg.success{color:#1E7A3C;}
  .footer-link{text-align:center; font-size:13px; color:var(--ink-soft); margin-top:20px;}
  .footer-link a{color:var(--stamp); font-weight:600;}
</style>
</head>
<body>

<div class="ticket">
  <div class="ticket-stub">
    <div class="brand-cluster">
      <div class="logo-badge"><img src="blogo.png" alt="Codexhub logo"></div>
      <div class="school-badge"><img src="slogo.jpg" alt="OOU logo"></div>
      <span class="brand-name">CodexHub</span>
    </div>
    <div class="ticket-top-row">
      <span class="ticket-serial">SESSION<br><b style="color:white; font-size:11px;">OOU-PUTME-2026</b></span>
      <div class="ticket-mark">ADMIT<br>ONE</div>
    </div>
    <h1>Welcome back</h1>
    <p class="lead">Log in to continue your mock exam.</p>
  </div>

  <div class="ticket-main">
    <form id="loginForm">
      <input type="email" id="loginEmail" placeholder="Email" required>
      <input type="password" id="loginPassword" placeholder="Password" required>
      <button type="submit" id="loginBtn">Log In</button>
      <div class="msg" id="loginMsg"></div>
    </form>

    <div class="footer-link">New here? <a href="/index.html#access">Sign up on the homepage</a></div>
  </div>
</div>

<script>
  const API_BASE_URL = 'https://codexhub-putme.onrender.com'; // same URL as your other pages

  const form = document.getElementById('loginForm');
  const msg = document.getElementById('loginMsg');
  const btn = document.getElementById('loginBtn');

  form.addEventListener('submit', async function(e){
    e.preventDefault();
    msg.textContent = '';
    msg.className = 'msg';

    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;

    btn.disabled = true;
    btn.textContent = 'Logging in...';

    try {
      const res = await fetch(`${API_BASE_URL}/api/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();

      if (!res.ok) {
        msg.textContent = data.error || 'Something went wrong. Please try again.';
        msg.className = 'msg error';
        btn.disabled = false;
        btn.textContent = 'Log In';
        return;
      }

      localStorage.setItem('codexhub_token', data.token);
      msg.textContent = "Welcome back! Redirecting...";
      msg.className = 'msg success';

      // Smart routing: send them exactly where they left off
      const user = data.user;
      let destination = '/dashboard.html';
      if (!user.department) {
        destination = '/department.html';
      } else if (!user.subjects || user.subjects.length === 0) {
        destination = '/subjects.html';
      }

      setTimeout(() => { window.location.href = destination; }, 800);
    } catch (err) {
      msg.textContent = 'Could not reach the server. Please check your connection and try again.';
      msg.className = 'msg error';
      btn.disabled = false;
      btn.textContent = 'Log In';
    }
  });
</script>

</body>
</html>
